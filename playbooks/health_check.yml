---
- name: Cisco XR Health Check
  hosts: xr_device
  gather_facts: false

  tasks:
    - name: Run show commands
      cisco.iosxr.iosxr_command:
        commands:
          - show version
          - show platform
          - show ip interface brief
      register: command_output

    - name: Display health report
      ansible.builtin.debug:
        msg:
          device_ip: "{{ ansible_host }}"
          show_version: "{{ command_output.stdout[0] | default('') }}"
          show_platform: "{{ command_output.stdout[1] | default('') }}"
          show_ip_interface_brief: "{{ command_output.stdout[2] | default('') }}"
          status: "healthy"

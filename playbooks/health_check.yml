---
- name: Cisco XR Health Check
  hosts: xr_device
  gather_facts: false
  connection: ssh

  tasks:
    - name: Run all show commands
      ansible.builtin.raw: |
        show version
        show platform
        show ip interface brief
      register: command_output

    - name: Build health report
      ansible.builtin.set_fact:
        health_report:
          device_ip: "{{ ansible_host }}"
          output: "{{ command_output.stdout_lines | default([]) }}"
          status: "healthy"

    - name: Display health report
      ansible.builtin.debug:
        msg: "{{ health_report | to_json }}"

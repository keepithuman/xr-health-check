---
- name: Cisco XR Health Check
  hosts: xr_device
  gather_facts: false

  tasks:
    - name: Run show version
      ansible.netcommon.cli_command:
        command: show version
      register: show_version

    - name: Run show platform
      ansible.netcommon.cli_command:
        command: show platform
      register: show_platform

    - name: Run show ip interface brief
      ansible.netcommon.cli_command:
        command: show ip interface brief
      register: show_ip_int_brief

    - name: Display health report
      ansible.builtin.debug:
        msg:
          device_ip: "{{ ansible_host }}"
          show_version: "{{ show_version.stdout | default('') }}"
          show_platform: "{{ show_platform.stdout | default('') }}"
          show_ip_interface_brief: "{{ show_ip_int_brief.stdout | default('') }}"
          status: "healthy"
